; Compilar con PlatformIO desde esta carpeta:  pio run  /  pio run -t upload  /  pio device monitor
; Tambien se abre tal cual con el Arduino IDE (banda_clasificadora.ino).
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; upload_port = /dev/ttyUSB0   ; descomentar y ajustar si hay varios puertos
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
